<rect x="30" y="196" width="250" height="54" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
<text x="42" y="218" font-family="Consolas, Menlo, Courier New, monospace" font-size="16" fill="#0969da" font-weight="bold" text-anchor="start" xml:space="preserve">right_drive</text>
<text x="42" y="238" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#59636e" font-weight="normal" text-anchor="start" xml:space="preserve">drive motor + encoder cable</text>
<line x1="280" y1="223" x2="354" y2="251" stroke="#0969da" stroke-width="2.5"/>
<rect x="30" y="272" width="250" height="54" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
<text x="42" y="294" font-family="Consolas, Menlo, Courier New, monospace" font-size="16" fill="#0969da" font-weight="bold" text-anchor="start" xml:space="preserve">arm</text>
<text x="42" y="314" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#59636e" font-weight="normal" text-anchor="start" xml:space="preserve">arm motor + encoder cable</text>
<line x1="280" y1="299" x2="354" y2="285" stroke="#0969da" stroke-width="2.5"/>
<rect x="30" y="380" width="250" height="54" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
<text x="42" y="402" font-family="Consolas, Menlo, Courier New, monospace" font-size="16" fill="#8250df" font-weight="bold" text-anchor="start" xml:space="preserve">claw</text>
<text x="42" y="422" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#59636e" font-weight="normal" text-anchor="start" xml:space="preserve">servo</text>
<text x="42" y="450" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start" font-style="italic" xml:space="preserve">black/brown wire toward the - (ground) mark</text>
<line x1="280" y1="407" x2="354" y2="383" stroke="#8250df" stroke-width="2.5"/>
<rect x="700" y="120" width="250" height="54" rx="8" fill="#ffffff" stroke="#bf8700" stroke-width="2"/>
<text x="712" y="142" font-family="Consolas, Menlo, Courier New, monospace" font-size="16" fill="#bf8700" font-weight="bold" text-anchor="start" xml:space="preserve">touch_sensor</text>
<text x="712" y="162" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#59636e" font-weight="normal" text-anchor="start" xml:space="preserve">REV Touch Sensor, Digital port 0-1</text>
<text x="712" y="190" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start" font-style="italic" xml:space="preserve">configure it as channel 1 (the odd one)</text>
<line x1="700" y1="147" x2="626" y2="217" stroke="#bf8700" stroke-width="2.5"/>
<rect x="700" y="300" width="250" height="54" rx="8" fill="#ffffff" stroke="#1f883d" stroke-width="2"/>
<text x="712" y="322" font-family="Consolas, Menlo, Courier New, monospace" font-size="16" fill="#1f883d" font-weight="bold" text-anchor="start" xml:space="preserve">sensor_color</text>
<text x="712" y="342" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#59636e" font-weight="normal" text-anchor="start" xml:space="preserve">REV Color Sensor V3, I2C bus 1</text>
<text x="712" y="370" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#59636e" font-weight="normal" text-anchor="start" font-style="italic" xml:space="preserve">about 1 cm above the floor, looking down</text>
<line x1="700" y1="327" x2="626" y2="417" stroke="#1f883d" stroke-width="2.5"/>
<text x="490" y="528" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="normal" text-anchor="middle" xml:space="preserve">White ports = used by the course robot.  Each motor&#x27;s encoder cable plugs in next to its motor port, with the same number.</text>
