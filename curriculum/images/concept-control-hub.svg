<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-label="Control Hub ports and what plugs in where">
<title>Control Hub ports and what plugs in where</title>
<defs></defs>
<rect x="0.5" y="0.5" width="979" height="559" rx="10" fill="#ffffff" stroke="#d1d9e0"/>
<text x="20" y="34" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#1f2328" font-weight="bold" text-anchor="start" xml:space="preserve">The course robot: what plugs in where</text>
<text x="20" y="56" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#59636e" font-weight="normal" text-anchor="start" font-style="italic" xml:space="preserve">Simplified drawing of a REV Control Hub. Port numbers are printed on the hub next to each port.</text>
<rect x="340" y="110" width="300" height="380" rx="14" fill="#2b2d30" stroke="#111111" stroke-width="2"/>
