<text x="490.0" y="160" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#afb8c1" font-weight="normal" text-anchor="middle" xml:space="preserve">(built-in IMU on I2C bus 0)</text>
<text x="354" y="194" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#afb8c1" font-weight="bold" text-anchor="start" xml:space="preserve">MOTOR</text>
