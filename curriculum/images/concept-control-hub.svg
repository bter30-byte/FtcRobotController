<rect x="540" y="404" width="86" height="26" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="583" y="422" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="middle" xml:space="preserve">I2C 1</text>
<rect x="540" y="438" width="86" height="26" rx="4" fill="#57606a" stroke="#111111" stroke-width="1"/>
<text x="583" y="456" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="normal" text-anchor="middle" xml:space="preserve">I2C 2</text>
<text x="540" y="478" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#afb8c1" font-weight="normal" text-anchor="start" xml:space="preserve">(I2C 3 too)</text>
