<text x="60" y="140" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#dfe1e5" font-weight="normal" text-anchor="start" xml:space="preserve">1  Open the run list at the top of Android Studio.</text>
<text x="60" y="164" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#dfe1e5" font-weight="normal" text-anchor="start" xml:space="preserve">2  Pick Robot Simulator.</text>
<text x="60" y="188" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#dfe1e5" font-weight="normal" text-anchor="start" xml:space="preserve">3  Click the green ► Run button. The simulator window opens.</text>
<text x="60" y="212" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#dfe1e5" font-weight="normal" text-anchor="start" xml:space="preserve"></text>
<text x="60" y="236" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#dfe1e5" font-weight="normal" text-anchor="start" xml:space="preserve">To put code on the REAL robot later, switch back to TeamCode.</text>
<text x="966" y="349" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#59636e" font-style="italic" text-anchor="end">Simplified drawing — your screen may look a little different.</text>
